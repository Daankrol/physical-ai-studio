# Full upstream-objective fine-tuning on four 80 GB CUDA GPUs.
# Frozen teachers generate depth and video targets online from RGB.
model:
  class_path: physicalai.policies.LingBotVLA2
  init_args:
    pretrained_name_or_path: robbyant/lingbot-vla-v2-6b
    robot_layout: so101
    training_recipe: upstream
    distillation_heads: true
    relative_action_groups: [arm.position]
    normalization_mode: MEAN_STD
    loss_type: fm
    gradient_checkpointing: true
    moe_backend: triton
    attention_backend: flex
    optimizer_lr: 5e-5
    scheduler_decay_lr: 5e-5

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    repo_id: local/custom
    root: /path/to/lerobot-dataset
    data_format: physicalai
    train_batch_size: 1
    val_batch_size: 1
    val_split: 0.1
    val_split_seed: 42
    num_workers: 4

trainer:
  accelerator: gpu
  devices: 4
  strategy:
    class_path: lightning.pytorch.strategies.ModelParallelStrategy
    init_args:
      data_parallel_size: 4
      tensor_parallel_size: 1
      # Plain CPU checkpoints can also restore/export outside a distributed process.
      save_distributed_checkpoint: false
  precision: 32-true
  max_steps: 10000
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_train_steps: 1000
        save_last: true
        save_top_k: 1
